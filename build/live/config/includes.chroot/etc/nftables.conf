#!/usr/sbin/nft -f
# CudaLite OS firewall: default-deny inbound. The image runs no network services,
# so nothing needs to be reachable. Outbound is allowed; replies to it are accepted.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state invalid drop
		ct state established,related accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
	chain output {
		type filter hook output priority 0; policy accept;
	}
}
